<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manual KYC Review Required — CheckMate Admin</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 20px 10px;
      background-color: #0a0b0f;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
      color: #f0f0ee;
    "
  >
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="
        max-width: 600px;
        margin: 0 auto;
        background-color: #0d1017;
        border-radius: 8px;
        border-top: 2px solid #8b5cf6;
      "
    >
      <tr>
        <td align="center" style="padding: 30px 20px 15px 20px">
          <img
            src="https://playcheckmate.app/logo2.png"
            alt="CheckMate"
            width="180"
            style="display: block; max-width: 100%; height: auto"
          />
        </td>
      </tr>
      <tr>
        <td align="center" style="padding: 15px 20px; text-align: center;">
          <h1
            style="
              color: #ffffff;
              font-size: 26px;
              margin-top: 0;
              margin-bottom: 16px;
              text-align: center;
            "
          >
            Manual KYC Review Required
          </h1>
          <p
            style="
              color: #9ca3af;
              font-size: 15px;
              line-height: 1.6;
              margin-bottom: 24px;
              text-align: center;
            "
          >
            Admin, a user session has been flagged for manual review by Didit.
          </p>

          <div
            style="
              background-color: #1a1f2e;
              padding: 24px;
              border-radius: 8px;
              text-align: center;
              margin-bottom: 30px;
              border: 1px solid #2a3142;
            "
          >
            <p
              style="
                color: #9ca3af;
                font-size: 14px;
                margin-top: 0;
                margin-bottom: 8px;
              "
            >
              User Name
            </p>
            <p
              style="
                color: #ffffff;
                font-size: 18px;
                margin-top: 0;
                margin-bottom: 20px;
                font-weight: bold;
              "
            >
              {{displayName}}
            </p>
            <p
              style="
                color: #9ca3af;
                font-size: 14px;
                margin-top: 0;
                margin-bottom: 8px;
              "
            >
              User ID (vendor_data)
            </p>
            <p
              style="
                color: #ffffff;
                font-size: 14px;
                margin: 0;
                font-family: monospace;
              "
            >
              {{uid}}
            </p>
          </div>
          
          <a
            href="https://business.didit.me/"
            style="
              background-color: #8b5cf6;
              color: #ffffff;
              padding: 12px 24px;
              text-decoration: none;
              font-weight: bold;
              border-radius: 6px;
              display: inline-block;
              margin-bottom: 30px;
            "
          >
            Open Didit Console
          </a>
        </td>
      </tr>
    </table>
  </body>
</html>
